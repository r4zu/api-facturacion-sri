services:
  carbone:
    image: carbone/carbone-ee:latest
    container_name: sri-carbone
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      - CARBONE_EE_STUDIO=true
    volumes:
      - ./data:/data
    healthcheck:
      test: [ 'CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/status' ]
      interval: 30s
      timeout: 10s
      retries: 3
