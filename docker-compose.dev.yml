services:
  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    container_name: sri-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'

  # ─── Redis (BullMQ + Cache) ───
  redis:
    image: redis:7-alpine
    container_name: sri-redis
    command: >
      /bin/sh -c '
      if [ "${REDIS_PASSWORD}" != "" ]; then
        exec redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
      else
        exec redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
      fi
      '
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
