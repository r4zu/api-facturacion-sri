services:
  api-facturacion-sri:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-facturacion-sri
    restart: always
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      PORT: 8080
    volumes:
      - ../data/templates:/data/templates
      - ../data/pdfs:/data/pdfs
      - ../data/certs:/data/certs
      - ../data/xmls:/data/xmls
